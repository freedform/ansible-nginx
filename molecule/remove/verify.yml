---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Stat nginx binary
      ansible.builtin.stat:
        path: /usr/sbin/nginx
      register: nginx_binary

    - name: Assert nginx binary is absent
      ansible.builtin.assert:
        that: not nginx_binary.stat.exists
        fail_msg: "/usr/sbin/nginx should not exist"

    - name: Stat nginx config directory
      ansible.builtin.stat:
        path: /etc/nginx
      register: nginx_dir

    - name: Assert nginx config directory is absent
      ansible.builtin.assert:
        that: not nginx_dir.stat.exists
        fail_msg: "/etc/nginx should not exist"

    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert nginx package is not installed
      ansible.builtin.assert:
        that: "'nginx' not in ansible_facts.packages"
        fail_msg: "nginx package should not be installed"
